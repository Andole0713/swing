<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwingFrame は引っ越しました</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="3;url=https://andole0713.github.io/-/app/swing/">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1712;color:#ece6da;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;text-align:center;padding:24px}
a{display:inline-block;margin-top:16px;background:linear-gradient(135deg,#e2cc9a,#c8a96a);color:#1a1407;font-weight:700;text-decoration:none;border-radius:999px;padding:12px 24px}
p{color:#a8ab9f;font-size:14px}
</style>
</head>
<body>
<div>
  <h1 style="font-size:20px">SwingFrame は引っ越しました</h1>
  <p>All Time Golf のアプリの中に入りました。<br>自動で移動します。移動しない場合は下のボタンを押してください。</p>
  <a href="https://andole0713.github.io/-/app/swing/">新しい SwingFrame を開く</a>
  <p style="margin-top:20px">ホーム画面に追加している場合は、新しいページを開いてから<br>もう一度ホーム画面に追加してください。</p>
</div>
<script>
// 古い SwingFrame のオフライン用データを消してから移動する
(async function () {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function (r) { return r.unregister(); }));
    }
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.filter(function (k) { return k.indexOf('swingframe-') === 0; }).map(function (k) { return caches.delete(k); }));
    }
  } catch (e) {}
  location.replace('https://andole0713.github.io/-/app/swing/');
})();
</script>
</body>
</html>
